			<polygon points="485 55, 473.9473 59.67302, 473.9473 50.32698" style="stroke: rgb(9%,23%,23%); stroke-linecap: butt; stroke-width: 1; fill: rgb(9%,23%,23%); fill-rule: evenodd;"/>
			<path d="M 90,55 L 90,245 Z" style="stroke: rgb(9%,23%,23%); stroke-linecap: butt; stroke-width: 3;"/>
